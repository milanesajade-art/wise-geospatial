name: Restore GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable legacy Pages build from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "404" ]; then
            curl --fail-with-body --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
              --data '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          elif [ "$status" != "200" ]; then
            echo "Unable to read Pages status (HTTP $status)." >&2
            exit 1
          fi
          echo "Pages configuration:"
          curl --fail-with-body \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          echo "DNS resolution:"
          curl --silent "https://dns.google/resolve?name=wise-geospatial.com&type=A"
          echo
          curl --silent "https://dns.google/resolve?name=wise-geospatial.com&type=CNAME"
